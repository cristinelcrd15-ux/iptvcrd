<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canale TV</title>
<style>
:root{--bg:#0f1a2b;--panel:#182b47;--text:#eef2f8;--muted:#93a6bf;--sig:#ffb703}
*{box-sizing:border-box}
html{font-size:2.4vh}
@media (max-aspect-ratio:1/1){html{font-size:2vh}}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
video{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain}
#ui{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--bg);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;padding:.8rem 1.5rem;background:var(--panel)}
#brand{font-weight:700;font-size:1.2rem;margin-right:1.5rem}
button{font:inherit;color:var(--text);background:transparent;border:.12rem solid var(--muted);border-radius:.4rem;padding:.3rem .9rem;margin-right:1rem;cursor:pointer}
h1{flex:1;margin:0;font-size:1.1rem;font-weight:500;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#q{font:inherit;width:14rem;max-width:100%;color:var(--text);background:var(--bg);border:.12rem solid var(--muted);border-radius:.4rem;padding:.35rem .8rem}
#q:focus{outline:none;border-color:var(--sig)}
#grid{flex:1;overflow-y:auto;position:relative;display:flex;flex-wrap:wrap;align-content:flex-start;padding:1rem 1rem 2rem 1.5rem}
.t{width:11rem;height:8.5rem;margin:.5rem;padding:.75rem;border-radius:.6rem;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s;background:linear-gradient(160deg,hsl(var(--h),42%,32%),hsl(var(--h),48%,20%))}
.t.on{outline:.22rem solid var(--sig);outline-offset:.1rem;transform:scale(1.05);position:relative;z-index:1}
.t b{font-size:1.8rem;letter-spacing:.02em}
.n{margin-top:auto;font-weight:600;line-height:1.15;max-height:2.3em;overflow:hidden}
.s{font-size:.7rem;color:#d3dcea;margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{padding:.5rem 1.5rem;font-size:.7rem;color:var(--muted);background:var(--panel)}
#msg{display:none;position:fixed;left:50%;bottom:6%;transform:translateX(-50%);background:rgba(15,26,43,.92);padding:.6rem 1.2rem;border-radius:.5rem;max-width:80%;text-align:center}
#pback{display:none;position:fixed;top:1rem;left:1rem;background:rgba(15,26,43,.85)}
</style>
</head>
<body>
<video id="v" playsinline></video>
<div id="ui">
  <header>
    <div id="brand">Canale TV</div>
    <button id="back" style="display:none">‹ Înapoi</button>
    <h1 id="title">Alege țara</h1>
    <input id="q" type="search" placeholder="Caută canal" autocomplete="off">
  </header>
  <div id="grid"></div>
  <div id="status">Se încarcă…</div>
</div>
<button id="pback">‹ Lista</button>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
// ---------- Setări (poți lăsa cum sunt) ----------
var PLAYLISTS_FILE = "playlists.txt"; // fișierul în care pui linkurile tale
var PROXY = "";                        // opțional, ex: "https://numele-tau.workers.dev/?url="
var REFRESH_MIN = 30;                  // la câte minute se reîncarcă listele
var MAX_PER_GROUP = 3000;

// ---------- Cod ----------
function $(id){ return document.getElementById(id); }
var video = $("v"), ui = $("ui"), grid = $("grid"), statusEl = $("status"), msgEl = $("msg");
var titleEl = $("title"), qEl = $("q"), backEl = $("back"), pbackEl = $("pback");
var groupsMap = {}, groupNames = [], flat = [], items = [], playList = [], onEl = null;
var curGroup = "", view = "home", isSearch = false, cur = -1, selI = 0, firstLoad = true;
var hls = null, token = 0, msgTimer = null, qTimer = null, pbTimer = null;

function store(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function load(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function two(n){ return (n < 10 ? "0" : "") + n; }
function setStatus(t){ statusEl.textContent = t; }
function trim(s){ return s.replace(/^\s+|\s+$/g, ""); }

function showMsg(t, ms){
  clearTimeout(msgTimer);
  msgEl.textContent = t; msgEl.style.display = "block";
  if (ms) msgTimer = setTimeout(hideMsg, ms);
}
function hideMsg(){ msgEl.style.display = "none"; }
function showPBack(){
  pbackEl.style.display = "block";
  clearTimeout(pbTimer);
  pbTimer = setTimeout(function(){ pbackEl.style.display = "none"; }, 4000);
}

function get(url, cb){
  var x = new XMLHttpRequest();
  x.open("GET", url, true);
  x.timeout = 60000;
  x.onload = function(){ if (x.status >= 200 && x.status < 300) cb(null, x.responseText); else cb(new Error("HTTP " + x.status)); };
  x.onerror = x.ontimeout = function(){ cb(new Error("rețea")); };
  x.send();
}
function getSmart(url, cb){
  get(url, function(err, t){
    if (!err || !PROXY) return cb(err, t);
    get(PROXY + encodeURIComponent(url), cb);
  });
}

function parse(text, src){
  var out = [], lines = text.split(/\r?\n/), info = null, i, l, m;
  if (/#EXT-X-(STREAM-INF|TARGETDURATION)/.test(text)) {
    return [{ name: src.replace(/^https?:\/\//, "").split("/").slice(0, 2).join("/"), group: "Link direct", url: src }];
  }
  for (i = 0; i < lines.length; i++) {
    l = trim(lines[i]);
    if (!l) continue;
    if (l.indexOf("#EXTINF") === 0) {
      m = l.match(/group-title="([^"]*)"/);
      info = { name: trim(l.substring(l.lastIndexOf(",") + 1)) || "Canal", group: m ? m[1] : "" };
    } else if (l.charAt(0) !== "#" && /^https?:\/\//i.test(l)) {
      out.push({ name: info ? info.name : l, group: info ? info.group : "", url: l });
      info = null;
    }
  }
  return out;
}

// ---------- Ecranele: țări, canale, rezultate ----------
function hue(s){ var h = 0, i; for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function mono(s){
  var p = trim(s.replace(/[^A-Za-zÀ-ž0-9 ]/g, "")).split(/\s+/), a = p[0] || "";
  return (a.charAt(0) + (p[1] ? p[1].charAt(0) : a.charAt(1))).toUpperCase();
}
function tile(i, name, sub){
  return '<div class="t" data-i="' + i + '" style="--h:' + hue(name) + '"><b>' + esc(mono(name)) + '</b><span class="n">' + esc(name) + '</span>' + (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</div>';
}

function renderTiles(){
  var h = [], i, c;
  for (i = 0; i < items.length; i++) {
    c = items[i];
    h.push(tile(i, c.name, view === "home" ? c.sub : (isSearch ? c.group : "")));
  }
  grid.innerHTML = h.join("");
  grid.scrollTop = 0;
  onEl = null;
}

function select(i){
  if (!items.length) return;
  selI = Math.max(0, Math.min(items.length - 1, i));
  var el = grid.children[selI];
  if (!el) return;
  if (onEl) onEl.className = "t";
  el.className = "t on";
  onEl = el;
  var top = el.offsetTop - 12, bottom = el.offsetTop + el.offsetHeight + 24;
  if (top < grid.scrollTop) grid.scrollTop = top;
  else if (bottom > grid.scrollTop + grid.clientHeight) grid.scrollTop = bottom - grid.clientHeight;
}

function cols(){
  var t = grid.children, n = 0;
  if (!t.length) return 1;
  while (n < t.length && t[n].offsetTop === t[0].offsetTop) n++;
  return n || 1;
}

function showHome(){
  var i, k = 0;
  view = "home"; isSearch = false; items = [];
  titleEl.textContent = "Alege țara"; backEl.style.display = "none";
  for (i = 0; i < groupNames.length; i++) {
    items.push({ name: groupNames[i], sub: groupsMap[groupNames[i]].length + " canale" });
    if (groupNames[i] === curGroup) k = i;
  }
  renderTiles();
  select(k);
}

function openGroup(name, selUrl){
  var i, k = 0;
  curGroup = name; view = "list"; isSearch = false; items = groupsMap[name];
  titleEl.textContent = name + " · " + items.length + " canale"; backEl.style.display = "inline-block";
  store("iptv_group", name);
  renderTiles();
  if (selUrl) { for (i = 0; i < items.length; i++) { if (items[i].url === selUrl) { k = i; break; } } }
  select(k);
}

function openResults(text, selUrl){
  var i, k = 0, q = text.toLowerCase();
  items = [];
  for (i = 0; i < flat.length && items.length < 300; i++) {
    if (flat[i].name.toLowerCase().indexOf(q) !== -1) items.push(flat[i]);
  }
  view = "list"; isSearch = true;
  titleEl.textContent = "Rezultate pentru „" + text + "” · " + items.length; backEl.style.display = "inline-block";
  renderTiles();
  if (selUrl) { for (i = 0; i < items.length; i++) { if (items[i].url === selUrl) { k = i; break; } } }
  select(k);
}

function goBack(){
  qEl.value = "";
  showHome();
}

function activate(i){
  if (view === "home") { if (groupNames[i]) openGroup(groupNames[i]); }
  else if (items[i]) { playList = items; play(i); }
}

function setChannels(list){
  var playUrl = cur >= 0 && playList[cur] ? playList[cur].url : null;
  var selKey = items[selI] ? items[selI].url : null;
  var first = firstLoad, i, j, c, g, arr, found = false, lg;
  firstLoad = false;
  flat = list; groupsMap = {}; groupNames = [];
  for (i = 0; i < list.length; i++) {
    c = list[i]; g = c.group || "Altele";
    if (!groupsMap[g]) { groupsMap[g] = []; groupNames.push(g); }
    if (groupsMap[g].length < MAX_PER_GROUP) groupsMap[g].push(c);
  }
  groupNames.sort(function(a, b){ return a.localeCompare(b); });
  if (playUrl) {
    for (i = 0; i < groupNames.length && !found; i++) {
      arr = groupsMap[groupNames[i]];
      for (j = 0; j < arr.length; j++) { if (arr[j].url === playUrl) { playList = arr; cur = j; found = true; break; } }
    }
  }
  if (view === "play") return;
  playList = []; cur = -1;
  if (view === "list" && isSearch) { openResults(qEl.value, selKey); return; }
  lg = view === "list" ? curGroup : (first ? load("iptv_group") : null);
  if (lg && groupsMap[lg]) openGroup(lg, view === "list" ? selKey : (first ? load("iptv_last") : null));
  else showHome();
}

// ---------- Player ----------
function destroyHls(){ if (hls) { try { hls.destroy(); } catch (e) {} hls = null; } }

function stop(){
  token++;
  destroyHls();
  video.onerror = null; video.onplaying = null;
  video.pause();
  video.removeAttribute("src");
  try { video.load(); } catch (e) {}
  hideMsg();
}

function leavePlayer(){
  if (view !== "play") return;
  var url = playList[cur] ? playList[cur].url : null;
  stop();
  cur = -1;
  pbackEl.style.display = "none";
  ui.style.display = "flex";
  view = "list";
  if (isSearch) openResults(qEl.value, url);
  else openGroup(curGroup, url);
}

function play(i){
  if (!playList.length) return;
  cur = (i + playList.length) % playList.length;
  view = "play";
  ui.style.display = "none";
  showPBack();
  var c = playList[cur], u = c.url, my = ++token;
  store("iptv_last", u);
  showMsg(c.name + " — se încarcă…", 0);
  destroyHls();
  video.onerror = null;
  video.onplaying = function(){ if (my === token) showMsg(c.name, 2500); };
  function fail(){ if (my === token) showMsg("Canalul „" + c.name + "” nu pornește. Apasă ↑ sau ↓ pentru alt canal.", 0); }
  function native(){
    destroyHls();
    video.onerror = fail;
    video.src = u;
    var p = video.play();
    if (p && p.catch) p.catch(function(){});
  }
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.on(Hls.Events.ERROR, function(e, d){ if (d.fatal && my === token) native(); });
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ var p = video.play(); if (p && p.catch) p.catch(function(){}); });
    hls.loadSource(u);
    hls.attachMedia(video);
  } else {
    native();
  }
}

// ---------- Încărcarea listelor ----------
function fromCache(extra){
  var raw = load("iptv_channels"), a, l = [], i;
  if (raw) {
    try {
      a = JSON.parse(raw);
      for (i = 0; i < a.length; i++) l.push({ name: a[i][0], group: a[i][1], url: a[i][2] });
      setChannels(l);
      setStatus(extra + " Folosesc ultima listă salvată (" + l.length + " canale).");
      return;
    } catch (e) {}
  }
  setStatus(extra + " Nu există nicio listă salvată.");
}

function loadAll(){
  setStatus("Se actualizează lista…");
  getSmart(PLAYLISTS_FILE + "?t=" + new Date().getTime(), function(err, txt){
    if (err) return fromCache("Nu pot citi " + PLAYLISTS_FILE + ".");
    var urls = [], lines = txt.split(/\r?\n/), i, l;
    for (i = 0; i < lines.length; i++) {
      l = trim(lines[i]);
      if (/^https?:\/\//i.test(l)) urls.push(l);
    }
    if (!urls.length) return fromCache("Fișierul " + PLAYLISTS_FILE + " nu are linkuri.");
    var left = urls.length, all = [], ok = 0;
    urls.forEach(function(u){
      getSmart(u, function(e, t){
        if (!e) { var p = parse(t, u); if (p.length) { all = all.concat(p); ok++; } }
        if (--left === 0) finish(all, ok, urls.length);
      });
    });
  });
}

function finish(all, ok, total){
  if (!all.length) return fromCache("Niciun link nu a răspuns.");
  var seen = {}, uniq = [], packed = [], i;
  for (i = 0; i < all.length; i++) {
    if (!seen[all[i].url]) { seen[all[i].url] = 1; uniq.push(all[i]); packed.push([all[i].name, all[i].group, all[i].url]); }
  }
  setChannels(uniq);
  store("iptv_channels", JSON.stringify(packed));
  var d = new Date();
  setStatus(ok + " din " + total + " liste încărcate · " + uniq.length + " canale · actualizat " + two(d.getHours()) + ":" + two(d.getMinutes()));
}

// ---------- Telecomandă, mouse, atingere ----------
document.addEventListener("keydown", function(e){
  var k = e.keyCode, back = (k === 8 || k === 27 || k === 461 || k === 10009), n;
  if (document.activeElement === qEl) {
    if (k === 40 || k === 13) { qEl.blur(); e.preventDefault(); }
    else if (k === 27 || k === 461 || k === 10009) qEl.blur();
    return;
  }
  if (view === "play") {
    if (k === 38) play(cur - 1);
    else if (k === 40) play(cur + 1);
    else if (k === 13) { showPBack(); showMsg("Înapoi: lista de canale · ↑ ↓: schimbă canalul", 3000); }
    else if (back) leavePlayer();
    else return;
    e.preventDefault();
    return;
  }
  n = cols();
  if (k === 37) select(selI - 1);
  else if (k === 39) select(selI + 1);
  else if (k === 38) { if (selI - n < 0) qEl.focus(); else select(selI - n); }
  else if (k === 40) select(selI + n);
  else if (k === 13) activate(selI);
  else if (back && view === "list") goBack();
  else return;
  e.preventDefault();
});

grid.onclick = function(e){
  var t = e.target;
  while (t && t !== grid && !(t.className && /(^| )t( |$)/.test(t.className))) t = t.parentNode;
  if (!t || t === grid) return;
  var i = parseInt(t.getAttribute("data-i"), 10);
  select(i);
  activate(i);
};
backEl.onclick = goBack;
pbackEl.onclick = leavePlayer;
video.onclick = function(){ showPBack(); showMsg("Înapoi: lista de canale · ↑ ↓: schimbă canalul", 3000); };
qEl.oninput = function(){
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){
    var v = trim(qEl.value);
    if (v.length >= 2) openResults(v);
    else if (isSearch) showHome();
  }, 300);
};

loadAll();
setInterval(loadAll, REFRESH_MIN * 60000);
</script>
</body>
</html>
